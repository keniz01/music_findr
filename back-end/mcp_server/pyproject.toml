[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server for Music Findr application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.4",
    "hatch>=1.14.2",
    "starlette>=0.48.0",
    "uvicorn>=0.37.0",
    "sqlalchemy[asyncio]>=2.0.42",
    "sqlparse>=0.4.4",
    "punq>=0.7.0",
    "asyncpg>=0.30.0",
    "mcp[cli]>=1.16.0",
    "httpx>=0.28.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.dev]
dependencies = [
    "coverage>=7.3.2",
    "pre-commit>=3.5.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.0"
]

[tool.hatch.envs.dev.env-vars]
PYTHONPATH = "src:../data_accessor/src"

[tool.hatch.envs.dev.scripts]
test = """
python -m coverage run -m unittest discover -s tests -v && \
python -m coverage report
"""
format = "black src tests && isort src tests"
serve = "uvicorn main:app --reload --log-level debug --port 8000"

[tool.hatch.envs.dev.post-install]
commands = [
    "uv pip install -e ../data_accessor",
    "uv pip install -e .",
    "pre-commit install"
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "pass",
    "raise ImportError"
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
