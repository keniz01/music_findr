[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server for Music Findr application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.4",
    "hatch>=1.14.2",
    "starlette>=0.48.0",
    "uvicorn>=0.37.0",
    "sqlalchemy[asyncio]>=2.0.42",
    "sqlparse>=0.4.4",
    "punq>=0.7.0",
    "asyncpg>=0.30.0",
    "mcp[cli]>=1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src"]

[tool.hatch.envs.dev]
dependencies = [
    # Runtime dependencies
    "fastmcp>=2.12.4",
    "starlette>=0.48.0",
    "uvicorn>=0.37.0",
    "sqlalchemy[asyncio]>=2.0.42",
    "sqlparse>=0.4.4",
    "punq>=0.7.0",
    "asyncpg>=0.30.0",
    # Development dependencies
    "coverage>=7.3.2",
    "pre-commit>=3.5.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
]

[tool.hatch.envs.dev.scripts]
# Development environment setup
setup = [
    "pip install -e ../data_accessor",  # Install data_accessor in editable mode
    "pip install -e .",                 # Install mcp_server in editable mode
    "pre-commit install",               # Install git hooks
]

# Server commands
serve = "uvicorn src.postgres_server:app --reload --log-level debug"
serve-prod = "uvicorn src.postgres_server:app --workers 4"

# Test commands
test = """
python -m coverage run -m unittest discover -s tests -v && \
python -m coverage report
"""
coverage-report = "coverage html"
test-with-coverage = [
    "coverage run -m unittest discover -v -s tests",
    "coverage html"
]

# Code quality commands
lint = [
    "black .",
    "isort .",
    "mypy src tests",
]
format = [
    "black .",
    "isort .",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
