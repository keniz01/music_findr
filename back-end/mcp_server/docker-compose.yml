services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server:dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app:delegated
      - /app/.venv  # anonymous volume so container's venv persists
    environment:
      - UV_COMPILE_BYTECODE=1
      - UV_LINK_MODE=copy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    command: hatch run dev:serve
