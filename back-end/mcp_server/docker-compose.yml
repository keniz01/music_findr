services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/home/appuser/app  # Matches WORKDIR
      - ../data_accessor:/home/appuser/app/data_accessor
    environment:
      - PYTHONPATH=src:data_accessor
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - PIP_CERT=/etc/ssl/certs/ca-certificates.crt
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    command: hatch run dev:serve
