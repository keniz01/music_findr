[project]
name = "data-accessor"
version = "0.2.6"
description = "Data access solution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "hatch>=1.14.1",
    "punq>=0.7.0",
    "pydantic>=2.11.7",
    "sqlalchemy[asyncio]>=2.0.42",
    "sqlparse>=0.5.3",
    "toml>=0.10.2",
    "uvicorn>=0.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]
packages = ["data_accessor"]

[tool.hatch.build.targets.wheel]
packages = ["data_accessor"]

[project.optional-dependencies]
dev = [
    "coverage>=7.10.0"
]

[tool.hatch.envs.dev]
dependencies = []
variables = { PYTHONPATH = "src" }

[tool.hatch.envs.dev.scripts]
all = """
python -m coverage erase && \
python -m coverage run -m unittest discover -s tests -v && \
python -m coverage report && \
python -m coverage html && \
python -m webbrowser -t htmlcov/index.html
"""
# Run unit tests with detailed output and coverage
test = """
python -m coverage run -m unittest discover -s tests -v && \
python -m coverage report
"""
# Show terminal report only
coverage-report = "python -m coverage report"
# Generate HTML report
coverage-html = "python -m coverage html"
# Clean up coverage files
coverage-clean = "python -m coverage erase"

[dependency-groups]
dev = [
    "coverage>=7.10.6",
]
